# Render Blueprint for Apartment Intelligence v2 (one Git-backed Docker web service).
# Blueprint path in the Render dashboard: deploy/render.yaml
services:
  - type: web
    name: apartment-intelligence
    runtime: docker
    region: singapore
    plan: 1c-2g
    branch: main
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: ./
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: AI_ANALYSIS_TIMEOUT_S
        value: "15"
      - key: AI_EXPECTED_ORIGINS
        value: https://apartment-intelligence.onrender.com,https://apartments.senibina.com.sg,https://apartment.senibina.com.sg
      - key: AI_COOKIE_SECURE
        value: "true"
