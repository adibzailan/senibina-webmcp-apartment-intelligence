[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apartment-intelligence"
version = "2.0.0"
description = "Apartment Intelligence v2: deterministic solar evidence for HDB apartments (Ladybug + Radiance, headless)."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
  "numpy==2.5.2",
  "ladybug-core==0.44.59",
  "ladybug-geometry==1.35.4",
  "ladybug-radiance==0.2.12",
  "shapely==2.1.2",
  "trimesh==5.1.0",
  "rhino3dm==8.32.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.167.1", "httpx==0.28.1", "pvlib==0.15.2"]

[tool.setuptools]
package-dir = {"ai_geometry" = "packages/geometry/ai_geometry", "ai_solar" = "packages/solar/ai_solar", "ai_api" = "services/api/ai_api"}
packages = ["ai_geometry", "ai_solar", "ai_api"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/api"]
